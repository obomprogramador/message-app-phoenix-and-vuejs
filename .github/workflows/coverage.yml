name: Backend Coverage

on:
  pull_request:
    branches: [staging]

env:
  MIX_ENV: test
  PGHOST: localhost
  PGUSER: postgres
  PGPASSWORD: postgres
  PGDATABASE: message_app_test

jobs:
  coverage:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: message_app_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential git

      - name: Setup Elixir
        uses: erlef/setup-elixir@v1
        with:
          elixir-version: "1.20.2"
          otp-version: "28.0.1"

      - name: Cache Mix dependencies
        uses: actions/cache@v4
        with:
          path: |
            backend/deps
            backend/_build
          key: ${{ runner.os }}-mix-${{ hashFiles('backend/mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-mix-

      - name: Install Hex and Rebar
        run: |
          mix local.hex --force
          mix local.rebar --force
        working-directory: backend

      - name: Get dependencies
        run: mix deps.get
        working-directory: backend

      - name: Compile
        run: mix compile --warnings-as-errors
        working-directory: backend

      - name: Run tests with coverage
        run: mix coveralls.json > coverage.json
        working-directory: backend

      - name: Check coverage threshold
        run: |
          COVERAGE=$(python3 -c "import json; data=json.load(open('backend/coverage.json')); print(data['covered_percent'])")
          echo "Coverage: $COVERAGE%"
          if (( $(echo "$COVERAGE < 80" | bc -l) )); then
            echo "❌ Coverage $COVERAGE% is below the required 80%"
            exit 1
          fi
          echo "✅ Coverage $COVERAGE% meets the 80% threshold"
