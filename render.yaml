databases:
  - name: message-app-db
    databaseName: message_app_prod
    plan: free
    postgresMajorVersion: 16

services:
  - type: web
    name: message-app-backend
    runtime: docker
    dockerfilePath: backend/Dockerfile.render
    dockerContext: backend
    plan: free
    region: oregon
    healthCheckPath: /api/health
    buildFilter:
      paths:
        - backend/**
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: message-app-db
          property: connectionString
      - key: SECRET_KEY_BASE
        generateValue: true
      - key: MIX_ENV
        value: prod
      - key: PHX_HOST
        value: message-app-backend-o3ly.onrender.com
      - key: PORT
        value: "4000"
      - key: POOL_SIZE
        value: "5"
      - key: PHX_ALLOWED_ORIGINS
        value: https://message-app-frontend-w4bu.onrender.com

  - type: web
    name: message-app-frontend
    runtime: static
    buildCommand: cd frontend && npm ci && npm run build
    staticPublishPath: frontend/dist
    buildFilter:
      paths:
        - frontend/**
    envVars:
      - key: VITE_API_BASE_URL
        value: https://message-app-backend-o3ly.onrender.com/api
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
